version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 6
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      # One PR for all security fixes: they land fast, and the CI gate below
      # still applies. Dependabot drops an update from a group if it conflicts,
      # so one bad bump can't block the rest.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Routine version updates are batched so the PR queue stays readable.
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Majors we are deliberately NOT taking yet — each is a migration project,
    # not an update. Without this, Dependabot opens a fresh PR every week that
    # fails CI *and* burns a failing Vercel preview build: pure noise. Security
    # updates are unaffected by this block.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
