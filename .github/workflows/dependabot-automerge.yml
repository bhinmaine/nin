name: dependabot-automerge

# Merges Dependabot PRs that pass CI, with no human in the loop.
#
# Triggered by workflow_run (NOT pull_request) on purpose: Dependabot-triggered
# pull_request workflow runs get a read-only GITHUB_TOKEN, so a pull_request
# version of this workflow cannot merge anything. workflow_run always runs in
# the base-repo context with the permissions declared below, and gives us the
# CI verdict for free — a green "ci" run on a dependabot/ branch is the gate.
#
# Policy (see homeland docs/adr/0002):
#   everything -> merge when ci is green. Nothing is held for review.
#   A red CI run is the only thing that stops a merge; the workflow simply does
#   not fire. Majors are no exception: an update that cannot compile or breaks a
#   test never gets here, and the whole-economy majors are already muted in
#   dependabot.yml, so the ones that DO arrive are the ones CI can judge.
#
# The PR lookup retries: Dependabot pushes the branch and the CI run starts
# before the pull request record exists, so an immediate lookup misses it.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  automerge:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    # Dependabot often opens several PRs at once and they all go green together;
    # concurrent merges race on the base branch ("Base branch was modified").
    # Serialize them per repo instead of racing.
    concurrency:
      group: dependabot-automerge
      cancel-in-progress: false
    steps:
      # gh needs a work tree for `pr merge` (it does local git work to delete
      # the branch) — without a checkout it dies with "not a git repository".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Evaluate and merge the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_FROM_EVENT: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          pr="${PR_FROM_EVENT:-}"
          for _ in $(seq 1 10); do
            [ -n "$pr" ] && break
            pr=$(gh api "repos/$REPO/pulls?head=$REPO:$BRANCH&state=open" --jq '.[0].number // empty' 2>/dev/null || true)
            [ -n "$pr" ] && break
            echo "PR for $BRANCH not visible yet — retrying in 30s"
            sleep 30
          done

          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH after retries — nothing to do."
            exit 0
          fi

          author=$(gh api "repos/$REPO/pulls/$pr" --jq .user.login)
          title=$(gh api "repos/$REPO/pulls/$pr" --jq .title)
          echo "PR #$pr by $author: $title"

          if [ "$author" != "dependabot[bot]" ]; then
            echo "Not a Dependabot PR — refusing to auto-merge."
            exit 0
          fi

          # CI said success on this exact head branch, so there is nothing left
          # to judge. Merge.
          echo "Merging PR #$pr."
          merged=0
          for attempt in 1 2 3; do
            if gh pr merge "$pr" --squash --delete-branch; then
              merged=1
              break
            fi
            # The base branch moving under us is normal when several Dependabot
            # PRs land together; retry, and treat an already-closed PR as done.
            state=$(gh api "repos/$REPO/pulls/$pr" --jq .state || echo open)
            if [ "$state" = "closed" ]; then
              echo "PR #$pr is already closed — treating as merged."
              merged=1
              break
            fi
            echo "merge attempt $attempt failed — retrying in 20s"
            sleep 20
          done

          if [ "$merged" -ne 1 ]; then
            # GitHub refuses to let the Actions token update workflow files
            # ("refusing to allow a GitHub App to create or update workflow
            # ... without `workflows` permission"), which is why some
            # github-actions bumps cannot self-merge. Flag it for the weekly
            # audit instead of failing loudly here.
            gh label create needs-manual-merge --color FBCA04 \
              --description "Dependabot PR the Actions token cannot merge" --force >/dev/null 2>&1 || true
            gh pr edit "$pr" --add-label needs-manual-merge >/dev/null 2>&1 || true
            gh pr comment "$pr" --body "Auto-merge could not land this one: GitHub blocks the Actions token from updating workflow files (\`without workflows permission\`). Flagged \`needs-manual-merge\` — the weekly Dependabot audit picks it up." || true
            echo "::warning::PR #$pr needs a manual merge (workflow-file permission)"
            exit 0
          fi
